services:
  - type: web
    name: safe-bmod-registration
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safe-bmod-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        generateValue: true
      - key: ENABLE_PUBLIC_LIST
        value: "true"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: safe-bmod-db
    plan: free
